<!--
lexis corner controls — the bottom-left button group.

Builds one fixed `.lexis-controls` wrapper in the card's bottom-left corner
holding, bottom to top:

  * the reveal.js-menu hamburger, ADOPTED out of the plugin's own corner spot
    so it sits in the group and is always visible;
  * an up-arrow handle;
  * a collapsible tray above the arrow carrying, top to bottom, Home,
    Slide overview (`o`), and Full screen (`f`).

Collapsed, only the hamburger and the arrow show. Hovering the arrow or the
tray expands it, leaving closes it, and clicking the arrow toggles it either
way; `:focus-within` in the CSS covers keyboard users. Hovering the HAMBURGER
expands nothing — it lives in the wrapper (for the shared tile look and the
shared hiding) but outside the flyout that triggers expansion.

The look is `.lexis-controls` / `.lexis-ctrl` in lexis.scss; the only state
this script owns is `.is-open` on the flyout and `.is-hidden` on the wrapper
(set while overview mode is active, since the tile grid is its own full-window
UI and the group would float on top of it).

Full screen is skipped entirely on devices with no Fullscreen API — iPhone
Safari has none, prefixed or not — rather than shipping a dead button. iPads
and Android browsers do have it and keep it.

Nothing here touches overview behaviour itself: loading every slide, painting
background tiles, the wheel and the keyboard grid all belong to
lexis-overview.html, which runs independently.
-->
<script>
(function () {
  "use strict";

  // Inline Lucide-style SVG paths, so nothing depends on an icon font or a
  // library having finished booting.
  var ICONS = {
    house:
      '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>' +
      '<polyline points="9 22 9 12 15 12 15 22"/>',
    grid:
      '<rect width="7" height="7" x="3" y="3" rx="1"/>' +
      '<rect width="7" height="7" x="14" y="3" rx="1"/>' +
      '<rect width="7" height="7" x="14" y="14" rx="1"/>' +
      '<rect width="7" height="7" x="3" y="14" rx="1"/>',
    maximize:
      '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>' +
      '<path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
    minimize:
      '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/>' +
      '<path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>',
    chevronUp: '<path d="m18 15-6-6-6 6"/>',
    redo:
      '<path d="m15 14 5-5-5-5"/>' +
      '<path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/>'
  };
  function svg(icon) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"' +
      ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
      ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      ICONS[icon] + '</svg>';
  }
  function mkBtn(icon, label, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "lexis-ctrl";
    b.setAttribute("aria-label", label);
    b.title = label;
    b.innerHTML = svg(icon);
    b.addEventListener("click", function () {
      onClick();
      b.blur(); // drop the focus ring after a mouse click
    });
    return b;
  }

  var wrap = document.createElement("div");
  wrap.className = "lexis-controls";
  var tray = document.createElement("div");
  tray.className = "lexis-controls-tray";
  var stack = document.createElement("div");
  stack.className = "lexis-controls-stack";
  tray.appendChild(stack);

  // ---- Home / resume toggle ------------------------------------------------
  // Jumping home from anywhere else remembers the slide you left and flips the
  // button into a resume button; clicking again jumps back and flips it home.
  // Clicking home while already home stores nothing. The state lives in
  // sessionStorage keyed on the deck's path, so it survives a reload and dies
  // with the tab — a fresh window never opens with a resume pending. Moving
  // off the home slide by hand discards it (you've moved on, and it keeps the
  // stored slide from going stale).
  var RESUME_KEY = "lexisresume:" + location.pathname;
  function loadResume() {
    try { return JSON.parse(sessionStorage.getItem(RESUME_KEY) || "null"); }
    catch (e) { return null; }
  }
  function saveResume(indices) {
    try { sessionStorage.setItem(RESUME_KEY, JSON.stringify(indices)); }
    catch (e) { /* storage blocked (private mode): resume just won't persist */ }
  }
  function clearResume() {
    try { sessionStorage.removeItem(RESUME_KEY); }
    catch (e) { /* ignore */ }
  }

  var suppressResumeClear = false;
  var homeBtn = mkBtn("house", "First slide", function () {
    if (!(window.Reveal && Reveal.slide)) return;
    var pending = loadResume();
    if (pending && typeof pending.h === "number") {
      // The jump below fires slidechanged onto a non-home slide; without the
      // flag the manual-navigation listener would read that as "moved on".
      suppressResumeClear = true;
      Reveal.slide(pending.h, pending.v || 0, pending.f);
      clearResume();
      setHomeState(false);
    } else {
      var idx = Reveal.getIndices ? Reveal.getIndices() : { h: 0, v: 0 };
      if (idx.h !== 0 || (idx.v || 0) !== 0) {
        saveResume(idx);
        setHomeState(true);
      }
      Reveal.slide(0, 0, 0);
    }
  });
  function setHomeState(resume) {
    var label = resume ? "Resume where you left off" : "First slide";
    homeBtn.innerHTML = svg(resume ? "redo" : "house");
    homeBtn.title = label;
    homeBtn.setAttribute("aria-label", label);
  }
  setHomeState(!!loadResume()); // restore a pending resume across reloads
  stack.appendChild(homeBtn);

  stack.appendChild(mkBtn("grid", "Slide overview (O)", function () {
    if (window.Reveal && Reveal.toggleOverview) Reveal.toggleOverview();
  }));

  // ---- Full screen / exit toggle -------------------------------------------
  // Pure UI state: the click is always the same one toggle, and the icon and
  // label follow the browser's fullscreenchange event, so entering or leaving
  // via the `f` key or Esc keeps the button honest too.
  var fsSupported = !!(document.documentElement.requestFullscreen ||
    document.documentElement.webkitRequestFullscreen);
  if (fsSupported) {
    var isFullscreen = function () {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    };
    var fsBtn = mkBtn("maximize", "Full screen (F)", function () {
      var d = document, el = d.documentElement;
      if (isFullscreen()) {
        (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    });
    var setFsState = function (active) {
      var label = active ? "Exit full screen (F)" : "Full screen (F)";
      fsBtn.innerHTML = svg(active ? "minimize" : "maximize");
      fsBtn.title = label;
      fsBtn.setAttribute("aria-label", label);
    };
    var syncFs = function () { setFsState(isFullscreen()); };
    document.addEventListener("fullscreenchange", syncFs);
    document.addEventListener("webkitfullscreenchange", syncFs);
    stack.appendChild(fsBtn);
  }

  // ---- The flyout ----------------------------------------------------------
  // The arrow is a hover handle; the click toggle is for touch and keyboard,
  // where hover never fires. Collapse follows the cursor leaving the FLYOUT
  // (arrow plus tray, not any single button), so moving from the arrow onto
  // the tray keeps it open.
  var arrow = document.createElement("button");
  arrow.type = "button";
  arrow.className = "lexis-ctrl lexis-controls-arrow";
  arrow.setAttribute("aria-label", "Deck controls");
  arrow.title = "Deck controls";
  arrow.innerHTML = svg("chevronUp");
  var flyout = document.createElement("div");
  flyout.className = "lexis-controls-flyout";
  // One shared open state: hover opens, leaving closes, and a click on the
  // arrow toggles it either way — including closing while still hovered, which
  // is why hover is wired here and not as a CSS `:hover` rule (CSS would force
  // the tray back open under the cursor and eat the click-to-close).
  //
  // Hover goes through POINTER events filtered to real mice: a touch tap
  // emulates mouseenter right before click, so with plain mouseenter a tap
  // opened the tray (fake hover) and the click instantly toggled it shut —
  // mobile needed two taps. Filtering on pointerType makes one tap one toggle.
  arrow.addEventListener("click", function () {
    flyout.classList.toggle("is-open");
    arrow.blur();
  });
  flyout.addEventListener("pointerenter", function (e) {
    if (e.pointerType === "mouse") flyout.classList.add("is-open");
  });
  flyout.addEventListener("pointerleave", function (e) {
    if (e.pointerType === "mouse") flyout.classList.remove("is-open");
  });
  // Touch never runs the leave path above, so mirror mouse leave-to-close: a
  // tap landing anywhere outside the flyout closes the tray.
  document.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "mouse" && !flyout.contains(e.target)) {
      flyout.classList.remove("is-open");
    }
  });

  flyout.appendChild(tray);
  flyout.appendChild(arrow);
  wrap.appendChild(flyout);
  // Appended to <body>, which is reveal's viewport element in a Quarto deck —
  // so the wrapper inherits `--lexis-lb-x` / `--lexis-lb-y` (the letterbox band
  // it insets itself by) and sits as a SIBLING of `.reveal`, which is what the
  // `.reveal.has-dark-background ~ .lexis-controls` flip in lexis.scss keys on.
  document.body.appendChild(wrap);

  // The reveal.js-menu plugin creates its button asynchronously inside
  // `.reveal`; adopt it into the group once it exists, below the flyout so it
  // keeps the corner spot. Moving the node preserves the plugin's own click
  // listener; `.lexis-ctrl` gives it the shared tile look, and the plugin's
  // positioning rules (all scoped under `.reveal`) stop matching once it is
  // out of there.
  function adoptMenuButton() {
    var mb = document.querySelector(".reveal .slide-menu-button");
    if (!mb) return false;
    mb.classList.add("lexis-ctrl");
    wrap.appendChild(mb);
    return true;
  }

  // ---- Jump-to-slide input (`g`) hardening ---------------------------------
  // Reveal builds that box lazily, on the first `g` press, as a bare text
  // input — so the browser happily offers form-history and contact autofill
  // over a field that only ever takes a slide number, and a name-and-address
  // dropdown lands on the slide mid-talk. `type="number"` is the decisive
  // stroke: Safari-family autofill IGNORES `autocomplete="off"` but never
  // attaches to a numeric field. The rest closes the remaining doors —
  // `inputmode` also brings up a numeric keypad on touch, and the two data-
  // attributes tell 1Password and LastPass to stay away. (The spinner arrows
  // `type="number"` drags in are hidden in lexis.scss.)
  function armJumpInput() {
    var apply = function (input) {
      input.type = "number";
      input.min = "1";
      input.setAttribute("autocomplete", "off");
      input.setAttribute("autocorrect", "off");
      input.setAttribute("autocapitalize", "off");
      input.setAttribute("spellcheck", "false");
      input.setAttribute("inputmode", "numeric");
      input.setAttribute("data-lpignore", "true");
      input.setAttribute("data-1p-ignore", "");
    };
    var existing = document.querySelector(".jump-to-slide-input");
    if (existing) { apply(existing); return; }
    // Not built yet: catch it the moment reveal inserts it.
    var observer = new MutationObserver(function () {
      var found = document.querySelector(".jump-to-slide-input");
      if (found) { apply(found); observer.disconnect(); }
    });
    observer.observe(document.querySelector(".reveal") || document.body,
      { childList: true, subtree: true });
  }

  function wire() {
    if (!(window.Reveal && Reveal.isReady && Reveal.isReady())) return false;
    armJumpInput();
    // Manually navigating off the home slide discards a pending resume. The
    // resume click itself raises suppressResumeClear before jumping, and the
    // jump home lands ON the home slide, so neither trips this.
    Reveal.on("slidechanged", function (e) {
      if (suppressResumeClear) { suppressResumeClear = false; return; }
      if (((e.indexh || 0) !== 0 || (e.indexv || 0) !== 0) && loadResume()) {
        clearResume();
        setHomeState(false);
      }
    });
    var sync = function () {
      var over = Reveal.isOverview();
      wrap.classList.toggle("is-hidden", over);
      // `display: none` swallows the pointerleave that would clear a
      // tap-opened tray, so drop that state by hand while hidden.
      if (over) flyout.classList.remove("is-open");
    };
    Reveal.on("overviewshown", sync);
    Reveal.on("overviewhidden", sync);
    sync(); // in case overview is somehow already active
    return true;
  }

  // Reveal and the menu plugin each initialize on their own schedule, so each
  // gets its own poll rather than one waiting on the other.
  function pollMenu(budget) {
    if (adoptMenuButton() || budget <= 0) return;
    setTimeout(function () { pollMenu(budget - 1); }, 100);
  }
  function poll(budget) {
    if (wire() || budget <= 0) return;
    setTimeout(function () { poll(budget - 1); }, 100);
  }
  pollMenu(120); // ~12s
  poll(120);     // ~12s
})();
</script>
